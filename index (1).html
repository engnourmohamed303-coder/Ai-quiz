<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#14152a;--card:#1e2040;--tx:#eceefb;--mu:#9a9fc4;--pr:#8b8bf5;--bd:#32355e}}

.w{max-width:720px;margin:0 auto;padding:20px 16px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:12px 0}

.ch:hover,.o:hover{border-color:var(--pr)}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}

.b{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;cursor:pointer;margin-top:8px}
.b.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}

const W=[ // written questions: [chapter, question, model answer]
["Ch 1","Brief intro to the Turing test","A test proposed by Alan Turing: a human interrogator chats with a hidden human and a machine; if the interrogator cannot reliably tell which is the machine, the machine is considered intelligent."],
["Ch 1","Define an agent; how does a simple reflex agent operate?","An agent perceives its environment through sensors and acts on it through actuators. A simple reflex agent picks actions from the current percept only, using condition-action rules (IF condition THEN action)."],
["Ch 1","Example of a partially observable game","Poker: you cannot see the opponents' cards, so the state is only partially observable."],
["Ch 1","Simple reflex vs model-based reflex agents","Simple reflex: uses only the current percept. Model-based: keeps an internal state/model of how the world evolves, so it handles partially observable environments."],
["Ch 1","Reflex agents vs goal-based agents","Reflex agents act by fixed condition-action rules; goal-based agents consider future consequences and choose actions (search/planning) that achieve a goal."],
["Ch 2","What is a Learning Agent?","An agent that improves its performance from experience. Components: performance element, critic, learning element, problem generator."],
["Ch 2","How do we formulate a problem?","Define: initial state, actions (successor function), transition model, goal test, and path cost."],
["Ch 3","Major components for measuring problem-solving performance?","Completeness, optimality, time complexity, space complexity."],
["Ch 4","Basic structure of an expert system and how the parts interact","Knowledge base + inference engine + user interface (plus working memory/explanation facility). The user asks via the interface; the inference engine applies knowledge-base rules to facts and returns advice."],
["Ch 4","Main purpose of Expert Systems?","To capture human expert knowledge in a domain and use it to give advice, diagnose and solve problems."],
["Ch 4","Conventional programs vs rule-based systems","Conventional: knowledge and control are mixed in code (algorithmic). Rule-based: knowledge (rules) is separate from the inference engine and easy to modify."],
["Ch 4","Advantages of Expert Systems over human experts","Permanent, consistent, available 24/7, reproducible, cheaper, can be documented and explain reasoning."],
["Ch 4","Define Inference Engine","The component that applies reasoning (matching rules to facts) to the knowledge base to derive conclusions."],
["Ch 4","What is a Knowledge Base?","The store of domain facts and rules (expert knowledge) used by the system."],
["Ch 4","Define Forward and Backward Chaining","Forward: data-driven, start from facts and fire rules toward conclusions. Backward: goal-driven, start from a hypothesis and look for facts supporting it."]];
const $=s=>document.querySelector(s),app=$('#app');let S={};
const parse=t=>t.split('\n').map(l=>{const p=l.split('|');return{q:p[0],o:p.slice(1,5).filter(x=>x),a:+p[5]}});
function home(){app.innerHTML=`<h1>🎓 QuizMaster</h1><p class="mu">AI Applications – pick a chapter</p>`+
Object.keys(CH).map((k,i)=>`<button class="ch" onclick="start(${i})"><b>${k}</b><span class="mu">${parse(CH[k]).length} questions</span></button>`).join('')+
`<button class="ch" onclick="startAll()"><b>🔀 All chapters (shuffled)</b><span class="mu">${Object.values(CH).reduce((n,c)=>n+parse(c).length,0)} questions</span></button>
<button class="ch" onclick="written()"><b>📝 Written questions</b><span class="mu">${W.length} cards</span></button>`}
function begin(qs,t){S={qs,i:0,s:0,t,d:false,w:[]};show()}
function start(i){const k=Object.keys(CH)[i];begin(parse(CH[k]),k)}
function startAll(){const a=[].concat(...Object.values(CH).map(parse));a.sort(()=>Math.random()-.5);begin(a,'All chapters')}
function show(){const q=S.qs[S.i];S.d=false;
app.innerHTML=`<button class="b g" onclick="home()">← Back</button><div class="mu" style="margin-top:12px">${S.t} · ${S.i+1}/${S.qs.length}</div>
<div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><div class="card"><h3 style="margin-top:0">${q.q}</h3>`+
q.o.map((x,j)=>`<button class="o" onclick="pick(${j})">${'ABCD'[j]}. ${x}</button>`).join('')+`</div><div id="nx"></div>`}
function pick(j){if(S.d)return;S.d=true;const q=S.qs[S.i];if(j==q.a)S.s++;else S.w.push(q);
document.querySelectorAll('.o').forEach((b,k)=>{if(k==q.a)b.classList.add('ok');else if(k==j)b.classList.add('no')});
$('#nx').innerHTML=`<button class="b" onclick="next()">${S.i+1<S.qs.length?'Next →':'Finish'}</button>`}
function next(){S.i++;S.i<S.qs.length?show():done()}
function done(){const p=Math.round(S.s/S.qs.length*100);
app.innerHTML=`<h1>Result</h1><div class="card"><h2 style="margin:0">${S.s} / ${S.qs.length} (${p}%)</h2><p class="mu">${p>=85?'Excellent! 🎉':p>=60?'Good job, keep going 💪':'Review and try again 📚'}</p></div>`+
(S.w.length?`<h3>Review mistakes</h3>`+S.w.map(q=>`<div class="card"><b>${q.q}</b><p class="mu">Correct: ${q.o[q.a]}</p></div>`).join(''):'')+
`<button class="b" onclick="home()">Home</button> <button class="b g" onclick="begin(S.qs.slice().sort(()=>Math.random()-.5),S.t)">Retry shuffled</button>`}
function written(){app.innerHTML=`<button class="b g" onclick="home()">← Back</button><h1>📝 Written questions</h1><p class="mu">Tap a question to reveal the model answer.</p>`+
W.map(w=>`<details class="card"><summary>[${w[0]}] ${w[1]}</summary><p>${w[2]}</p></details>`).join('')}
home();
</script></body></html>
